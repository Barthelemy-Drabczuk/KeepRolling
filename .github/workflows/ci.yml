name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.69.0
          environments: test
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Run backend test suite
        working-directory: src/backend/app
        run: pixi run -e test pytest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never gating (REQ-CI-5/REQ-CI-6): this repo carries pre-existing
    # ruff debt (see CLAUDE.md's Coding style section). continue-on-error
    # must stay job-level, not step-level -- step-level would report the
    # step as success and hide the failure. Never add "lint" to main's
    # required-checks list (see .elm/ARCHITECTURE.md's REQ-CI-2/REQ-CI-3
    # prohibitions).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.69.0
          environments: dev
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: ruff check
        run: pixi run -e dev ruff check --output-format=github .

      - name: ruff format --check
        if: ${{ !cancelled() }}
        run: pixi run -e dev ruff format --check .
